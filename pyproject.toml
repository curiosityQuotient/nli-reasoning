[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nli-reasoning"
version = "0.1.0"
description = "An investigation into using NLI with LLMs"
authors = [
    {name = "Author Name", email = "author@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # jax <0.11 is required: jax 0.11.2 removed jax.experimental.hijax.HiPrimitive
    # which flax's NNX still imports (and flax 0.12.9 requires jax>=0.11), so the
    # 0.11.x line cannot be resolved with a working flax release.
    "jax>=0.8.1,<0.11",
    "flax>=0.12.0,<0.12.9",
    "optax",
    "orbax-checkpoint>=0.12.0,<0.13",
    "tensorflow-datasets",
    "grain",
    "humanize",
    "pandas",
    "kagglehub",
    "tqdm",
    "wandb>=0.22.0",
    "google-tunix>=0.1.7,<0.2",
    "qwix>=0.1.6,<0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
